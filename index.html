*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;scroll-padding-top:72px;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px;overflow-x:hidden;line-height:1.6;}
h1,h2,h3,h4,h5{font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.15;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:0.4;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px;}

/* BLOBS */
.blobs{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:0.15;animation:blobFloat 12s ease-in-out infinite;}
.blob1{width:600px;height:600px;background:var(--accent);top:-200px;left:-100px;}
.blob2{width:500px;height:500px;background:var(--accent2);bottom:-150px;right:-100px;animation-delay:-4s;}
.blob3{width:400px;height:400px;background:var(--accent3);top:40%;left:40%;animation-delay:-8s;}
@keyframes blobFloat{0%,100%{transform:translate(0,0)scale(1);}33%{transform:translate(40px,-30px)scale(1.05);}66%{transform:translate(-30px,20px)scale(0.95);}}

/* ANIMATIONS - visible by default, animate in when JS adds .animated */
@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
@keyframes gradientShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(0.8);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes dotPulse{0%,80%,100%{transform:scale(0.6);opacity:0.4;}40%{transform:scale(1);opacity:1;}}
@keyframes modalIn{from{opacity:0;transform:scale(0.93) translateY(16px);}to{opacity:1;transform:scale(1) translateY(0);}}

/* Reveal — elements are VISIBLE by default. JS adds .anim for smooth entrance */
.reveal{transition:opacity 0.6s ease,transform 0.6s ease;}
.reveal.visible{opacity:1;transform:translateY(0);}

/* CUSTOM DROPDOWN */
.cdd{position:relative;user-select:none;}
.cdd-trigger{display:flex;align-items:center;justify-content:space-between;gap:0.5rem;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:0.6rem 0.85rem;border-radius:8px;font-size:0.85rem;font-family:'DM Sans',sans-serif;cursor:pointer;transition:border-color 0.2s;min-width:120px;white-space:nowrap;}
.cdd-trigger:hover,.cdd-trigger.open{border-color:var(--accent);}
.cdd-trigger svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform 0.2s;flex-shrink:0;}
.cdd-trigger.open svg{transform:rotate(180deg);stroke:var(--accent);}
.cdd-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;background:var(--surface2);border:1px solid rgba(124,92,252,0.25);border-radius:10px;overflow:hidden;z-index:600;box-shadow:0 16px 40px rgba(0,0,0,0.5);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity 0.18s,transform 0.18s;}
.cdd-menu.open{opacity:1;transform:translateY(0);pointer-events:all;}
.cdd-option{padding:0.65rem 0.9rem;font-size:0.85rem;color:var(--muted);cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:0.5rem;white-space:nowrap;}
.cdd-option:hover{background:rgba(124,92,252,0.1);color:var(--text);}
.cdd-option.selected{color:var(--accent);background:rgba(124,92,252,0.08);}
.cdd-option.selected::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:auto;flex-shrink:0;}

/* LOADING */
.ai-loading{display:none;align-items:center;gap:0.75rem;padding:1.25rem 1rem;color:var(--muted);font-size:0.85rem;}
.ai-loading.show{display:flex;}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0;}
.typing-dots{display:flex;gap:4px;}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dotPulse 1.2s ease-in-out infinite;}
.typing-dots span:nth-child(2){animation-delay:0.2s;}
.typing-dots span:nth-child(3){animation-delay:0.4s;}

/* BUTTONS */
.copy-btn{display:inline-flex;align-items:center;gap:0.4rem;background:rgba(124,92,252,0.1);border:1px solid rgba(124,92,252,0.2);color:var(--accent);padding:0.35rem 0.75rem;border-radius:6px;cursor:pointer;font-size:0.72rem;font-weight:600;transition:all 0.2s;}
.copy-btn:hover{background:rgba(124,92,252,0.2);}
.copy-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.save-btn{display:inline-flex;align-items:center;gap:0.4rem;background:rgba(92,240,208,0.08);border:1px solid rgba(92,240,208,0.25);color:var(--accent3);padding:0.35rem 0.75rem;border-radius:6px;cursor:pointer;font-size:0.72rem;font-weight:600;transition:all 0.2s;}
.save-btn:hover{background:rgba(92,240,208,0.15);}
.save-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.output-actions{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.75rem;}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--muted);padding:0.5rem 1.2rem;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:0.875rem;transition:all 0.2s;}
.btn-ghost:hover{border-color:var(--accent);color:var(--text);}
.btn-primary{background:linear-gradient(135deg,var(--accent),#5a3fd6);color:#fff;border:none;padding:0.55rem 1.3rem;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:0.875rem;font-weight:500;transition:all 0.3s;box-shadow:0 0 20px var(--glow);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 30px var(--glow);}
.btn-hero{background:linear-gradient(135deg,var(--accent),#5a3fd6);color:#fff;border:none;padding:0.9rem 2.2rem;border-radius:12px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:1rem;font-weight:700;transition:all 0.3s;text-decoration:none;display:inline-flex;align-items:center;gap:0.5rem;box-shadow:0 0 40px var(--glow);}
.btn-hero:hover{transform:translateY(-3px);box-shadow:0 8px 50px var(--glow);}
.btn-hero-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text);padding:0.9rem 2.2rem;border-radius:12px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:500;transition:all 0.3s;text-decoration:none;display:inline-flex;align-items:center;gap:0.5rem;}
.btn-hero-ghost:hover{border-color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.07);}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;background:rgba(5,5,8,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);transition:padding 0.3s;}
.nav-logo{font-family:'Outfit',sans-serif;font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;}
.nav-links{display:flex;gap:2rem;list-style:none;}
.nav-links a{color:var(--muted);text-decoration:none;font-size:0.9rem;font-weight:500;transition:color 0.2s;cursor:pointer;}
.nav-links a:hover{color:var(--text);}
.nav-cta{display:flex;gap:0.75rem;align-items:center;}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;background:none;border:none;}
.hamburger span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px;transition:transform 0.3s ease, opacity 0.3s ease, top 0.3s ease;}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0);}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
#nav-user-name{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700;font-family:'Outfit',sans-serif;}
#nav-logout-btn{border-color:rgba(252,92,125,0.3);color:var(--accent2);}
#nav-logout-btn:hover{border-color:var(--accent2);background:rgba(252,92,125,0.08);}

/* Remove underline from all inline upgrade/plan links */
.hero-badge a, #hero-plan-badge a, .plan-badge a, .hero-badge a:hover, #hero-plan-badge a:hover { text-decoration: none !important; }

/* HERO AUTH STATE — controlled by class on <html> before paint */
html.is-logged-out #hero-loggedout { display: block !important; }
html.is-logged-out #hero-loggedin  { display: none  !important; }
html.is-logged-in  #hero-loggedin  { display: block !important; }
html.is-logged-in  #hero-loggedout { display: none  !important; }
/* Default: hide both until class is set */
#hero-loggedout, #hero-loggedin { display: none; }

/* HERO */
.hero{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8rem 2rem 4rem;text-align:center;}
.hero-content{max-width:800px;}
.hero-badge{display:inline-flex;align-items:center;gap:0.5rem;background:rgba(124,92,252,0.12);border:1px solid rgba(124,92,252,0.3);padding:0.4rem 1rem;border-radius:50px;font-size:0.8rem;color:#a98fff;margin-bottom:2rem;animation:fadeUp 0.6s ease both;}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--accent3);animation:pulse 2s ease-in-out infinite;}
.hero h1{font-size:clamp(2.8rem,7vw,5.5rem);font-weight:800;letter-spacing:-0.02em;margin-bottom:1.5rem;animation:fadeUp 0.6s 0.1s ease both;}
.hero h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;background-size:200% 200%;animation:gradientShift 4s ease infinite;}
.hero-sub{font-size:clamp(1rem,2.5vw,1.2rem);color:var(--muted);max-width:560px;margin:0 auto 2.5rem;font-weight:300;animation:fadeUp 0.6s 0.2s ease both;line-height:1.7;}
.hero-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;animation:fadeUp 0.6s 0.3s ease both;}
.hero-stats{display:flex;gap:2.5rem;justify-content:center;flex-wrap:wrap;margin-top:4rem;animation:fadeUp 0.6s 0.4s ease both;}
.stat{text-align:center;}
.stat-num{font-family:'Outfit',sans-serif;font-size:2rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.stat-label{font-size:0.8rem;color:var(--muted);}

/* SECTIONS */
section{position:relative;z-index:1;padding:6rem 2rem;scroll-margin-top:72px;}
.container{max-width:1100px;margin:0 auto;}
.section-tag{display:inline-block;font-size:0.75rem;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);margin-bottom:1rem;}
.section-title{font-size:clamp(2rem,4vw,3rem);font-weight:800;letter-spacing:-0.03em;margin-bottom:1.25rem;line-height:1.1;}
.section-desc{font-size:1.05rem;color:var(--muted);max-width:540px;line-height:1.7;font-weight:300;}
.center{text-align:center;}.center .section-desc{margin:0 auto;}

/* APP PREVIEW */
.app-preview{background:var(--surface2);border:1px solid var(--border);border-radius:24px;overflow:hidden;margin-top:4rem;box-shadow:0 40px 120px rgba(0,0,0,0.6),0 0 60px var(--glow),inset 0 1px 0 rgba(255,255,255,0.08);}
.app-bar{background:var(--surface);padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;border-bottom:1px solid var(--border);box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);}
.app-dots{display:flex;gap:6px;}
.app-dot{width:10px;height:10px;border-radius:50%;}
.app-dot:nth-child(1){background:#ff5f56;}.app-dot:nth-child(2){background:#febc2e;}.app-dot:nth-child(3){background:#28c840;}
.app-url{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:6px;padding:0.35rem 0.75rem;font-size:0.75rem;color:var(--muted);text-align:center;max-width:260px;margin:0 auto;}
.app-body{display:grid;grid-template-columns:200px 1fr;min-height:520px;}
.app-sidebar{background:rgba(0,0,0,0.3);border-right:1px solid var(--border);padding:1.25rem 0.75rem;}
.sidebar-logo{font-family:'Outfit',sans-serif;font-size:0.95rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:1.5rem;padding-left:0.5rem;}
.sidebar-item{display:flex;align-items:center;gap:0.6rem;padding:0.6rem 0.7rem;border-radius:8px;font-size:0.82rem;color:var(--muted);margin-bottom:0.2rem;cursor:pointer;transition:all 0.2s;user-select:none;}
.sidebar-item svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.sidebar-item:hover,.sidebar-item.active{background:rgba(124,92,252,0.12);color:var(--text);}
.sidebar-item.active{color:var(--accent);}
.app-main{position:relative;overflow:hidden;}
.app-panel{padding:1.25rem;position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 0.25s,transform 0.25s;transform:translateY(8px);overflow-y:auto;}
.app-panel.active{opacity:1;pointer-events:all;transform:translateY(0);position:relative;}
.app-greeting{font-family:'Outfit',sans-serif;font-size:1.05rem;font-weight:700;margin-bottom:0.25rem;display:flex;align-items:center;gap:0.5rem;}
.app-sub-text{font-size:0.78rem;color:var(--muted);margin-bottom:1.25rem;}
.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem;margin-bottom:1.25rem;}
.qa-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0.75rem 0.5rem;cursor:pointer;transition:all 0.2s;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);}
.qa-btn:hover{border-color:var(--accent);background:rgba(124,92,252,0.08);}
.qa-btn svg{width:18px;height:18px;margin:0 auto 0.35rem;display:block;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.qa-btn .qa-label{font-size:0.7rem;color:var(--muted);font-weight:500;}
.trending-label{font-size:0.7rem;color:var(--muted);margin-bottom:0.6rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;}
.idea-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0.65rem 0.9rem;margin-bottom:0.45rem;font-size:0.8rem;color:var(--text);display:flex;align-items:center;gap:0.5rem;transition:all 0.2s;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);}
.idea-item:hover{border-color:var(--accent);background:rgba(124,92,252,0.06);}
.idea-dot{width:6px;height:6px;border-radius:50%;background:var(--accent3);flex-shrink:0;}
.idea-tag{margin-left:auto;font-size:0.62rem;padding:0.18rem 0.45rem;border-radius:4px;font-weight:600;background:rgba(124,92,252,0.15);color:var(--accent);flex-shrink:0;}
.panel-title{font-family:'Outfit',sans-serif;font-size:0.95rem;font-weight:700;margin-bottom:0.9rem;}
.input-row{display:flex;gap:0.5rem;margin-bottom:0.9rem;align-items:center;flex-wrap:wrap;}
.app-input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:0.55rem 0.8rem;border-radius:8px;font-size:0.82rem;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s;}
.app-input:focus{border-color:var(--accent);}
.app-input::placeholder{color:var(--muted);}
.app-btn-sm{background:linear-gradient(135deg,var(--accent),#5a3fd6);color:#fff;border:none;padding:0.55rem 1rem;border-radius:8px;cursor:pointer;font-size:0.8rem;font-weight:600;font-family:'Outfit',sans-serif;white-space:nowrap;transition:all 0.2s;}
.app-btn-sm:hover{opacity:0.85;}.app-btn-sm:disabled{opacity:0.4;cursor:not-allowed;}
.output-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0.9rem;font-size:0.8rem;color:var(--text);line-height:1.75;min-height:70px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);}
.out-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--accent);font-weight:600;margin-bottom:0.45rem;}
.format-tabs{display:flex;gap:0.35rem;margin-bottom:0.9rem;flex-wrap:wrap;}
.format-tab{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:0.35rem 0.7rem;border-radius:6px;cursor:pointer;font-size:0.75rem;font-weight:500;transition:all 0.2s;}
.format-tab.active,.format-tab:hover{background:rgba(124,92,252,0.15);border-color:var(--accent);color:var(--text);}
.format-tab.pro-tab.locked{opacity:0.45;cursor:not-allowed;}
.format-tab.pro-tab.locked:hover{background:var(--surface);border-color:var(--border);color:var(--muted);}
.row-gap{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;margin-bottom:0.6rem;}
.empty-state{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:0.82rem;line-height:1.8;}
.empty-state svg{width:32px;height:32px;margin:0 auto 0.6rem;display:block;stroke:var(--muted);fill:none;stroke-width:1.5;opacity:0.35;}
.settings-label{display:block;font-size:0.7rem;font-weight:600;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:0.4rem;}
.settings-row{margin-bottom:0.9rem;}

/* HOW IT WORKS */
.how-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem;margin-top:3.5rem;}
.step-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2.25rem 1.75rem;position:relative;overflow:hidden;transition:transform 0.3s,border-color 0.3s;}
.step-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(124,92,252,0.05),transparent);opacity:0;transition:opacity 0.3s;}
.step-card:hover{transform:translateY(-6px);border-color:rgba(124,92,252,0.3);}
.step-card:hover::before{opacity:1;}
.step-num{font-family:'Outfit',sans-serif;font-size:3.5rem;font-weight:800;line-height:1;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;opacity:0.2;position:absolute;top:1.25rem;right:1.25rem;}
.step-icon-wrap{width:44px;height:44px;border-radius:12px;background:rgba(124,92,252,0.12);display:flex;align-items:center;justify-content:center;margin-bottom:1rem;}
.step-icon-wrap svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.step-card h3{font-size:1.15rem;font-weight:700;margin-bottom:0.65rem;}
.step-card p{color:var(--muted);font-size:0.9rem;line-height:1.7;}

/* FEATURES */
#features{background:var(--surface);}
.features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.25rem;margin-top:3.5rem;}
.feat-card{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:1.75rem;transition:all 0.3s;position:relative;overflow:hidden;}
.feat-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);transform:scaleX(0);transition:transform 0.4s;}
.feat-card:hover::after{transform:scaleX(1);}
.feat-card:hover{transform:translateY(-4px);border-color:rgba(124,92,252,0.2);}
.feat-icon-wrap{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:1rem;}
.feat-icon-wrap svg{width:20px;height:20px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.feat-card h3{font-size:1.05rem;font-weight:700;margin-bottom:0.5rem;}
.feat-card p{color:var(--muted);font-size:0.88rem;line-height:1.65;}

/* WORKFLOW */
.workflows{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-top:3.5rem;align-items:center;}
.workflow-text h2{font-size:clamp(1.7rem,3.5vw,2.4rem);letter-spacing:-0.03em;margin-bottom:1rem;}
.workflow-text p{color:var(--muted);line-height:1.7;margin-bottom:1.25rem;font-size:0.95rem;}
.workflow-list{list-style:none;}
.workflow-list li{display:flex;align-items:flex-start;gap:0.7rem;padding:0.55rem 0;font-size:0.93rem;color:var(--muted);border-bottom:1px solid var(--border);}
.workflow-list li:last-child{border:none;}
.check-icon{width:19px;height:19px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.check-icon svg{width:9px;height:9px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.workflow-visual{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1.75rem;}
.flow-step{display:flex;align-items:center;gap:0.9rem;padding:0.9rem;background:var(--surface2);border:1px solid var(--border);border-radius:12px;margin-bottom:0.65rem;transition:all 0.3s;}
.flow-step:hover{border-color:var(--accent);transform:translateX(4px);}
.flow-step-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.flow-step-icon svg{width:17px;height:17px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.flow-step-text h4{font-size:0.88rem;font-weight:600;margin-bottom:0.15rem;}
.flow-step-text p{font-size:0.76rem;color:var(--muted);}
.flow-arrow{text-align:center;color:var(--accent);font-size:0.9rem;margin:0.1rem 0;opacity:0.4;}

/* TESTIMONIALS */
.testi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem;margin-top:3.5rem;}
.testi-card{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.18);border-radius:20px;padding:1.75rem;transition:all 0.3s;}
.testi-card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.18);}
.testi-stars{color:#fedf89;font-size:0.85rem;margin-bottom:0.9rem;letter-spacing:2px;}
.testi-quote{font-size:0.93rem;color:#fff;line-height:1.7;margin-bottom:1.25rem;font-style:italic;}
.testi-author{display:flex;align-items:center;gap:0.7rem;}
.testi-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;font-family:'Outfit',sans-serif;flex-shrink:0;}
.testi-name{font-size:0.88rem;font-weight:600;color:#fff;}
.testi-role{font-size:0.76rem;color:rgba(255,255,255,0.7);}

/* PRICING */
.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;margin-top:3.5rem;}
.price-card{background:rgba(255,255,255,0.03);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border:1px solid rgba(255,255,255,0.1);border-top:1px solid rgba(255,255,255,0.18);border-radius:24px;padding:2.25rem 1.75rem;transition:all 0.3s;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:inset 0 1px 0 rgba(255,255,255,0.12),0 20px 60px rgba(0,0,0,0.3);}
.price-card:hover{transform:translateY(-4px);box-shadow:0 20px 60px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.18);border-color:rgba(255,255,255,0.18);}
.price-card.featured{border-color:rgba(124,92,252,0.5);border-top-color:rgba(124,92,252,0.7);background:rgba(124,92,252,0.08);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:0 0 80px rgba(124,92,252,0.2),inset 0 1px 0 rgba(124,92,252,0.3);}
.price-badge{position:absolute;top:1.25rem;right:1.25rem;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:0.62rem;font-weight:700;padding:0.28rem 0.7rem;border-radius:50px;letter-spacing:0.05em;text-transform:uppercase;}
.price-name{font-family:'Outfit',sans-serif;font-size:0.95rem;font-weight:700;margin-bottom:0.65rem;color:var(--muted);}
.price-amount{font-family:'Outfit',sans-serif;font-size:2.75rem;font-weight:800;line-height:1;letter-spacing:-0.04em;margin-bottom:0.2rem;}
.price-period{font-size:0.8rem;color:var(--muted);margin-bottom:1.75rem;}
.price-features{list-style:none;margin-bottom:1.75rem;flex:1;}
.price-features li{display:flex;align-items:center;gap:0.55rem;font-size:0.85rem;padding:0.45rem 0;border-bottom:1px solid var(--border);color:var(--muted);}
.price-features li:last-child{border:none;}
.price-features li svg{width:13px;height:13px;flex-shrink:0;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.tick svg{stroke:var(--accent3);}.cross{opacity:0.4;}.cross svg{stroke:#ff5f56;}

/* CTA */
.cta-section{text-align:center;padding:7rem 2rem;position:relative;overflow:hidden;}
.cta-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:300px;background:radial-gradient(ellipse,rgba(124,92,252,0.2),transparent 70%);pointer-events:none;}
.cta-section h2{font-size:clamp(2rem,5vw,3.5rem);letter-spacing:-0.03em;margin-bottom:1.25rem;}
.cta-section p{color:var(--muted);font-size:1.05rem;margin-bottom:2.5rem;max-width:480px;margin-left:auto;margin-right:auto;}

/* FOOTER */
footer{background:var(--surface);border-top:1px solid var(--border);padding:3rem 2rem 2rem;position:relative;z-index:1;}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:2rem;max-width:1100px;margin:0 auto 3rem;}
.footer-brand p{color:var(--muted);font-size:0.875rem;margin-top:0.75rem;line-height:1.7;max-width:260px;}
.footer-col h4{font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:1rem;}
.footer-col ul{list-style:none;}
.footer-col ul li a{color:var(--muted);text-decoration:none;font-size:0.875rem;display:block;padding:0.3rem 0;transition:color 0.2s;}
.footer-col ul li a:hover{color:var(--text);}
.footer-bottom{max-width:1100px;margin:0 auto;padding-top:1.5rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;}
.footer-bottom p{font-size:0.78rem;color:var(--muted);}

/* MODALS */
.modal-overlay{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.78);backdrop-filter:blur(14px);align-items:center;justify-content:center;padding:1rem;overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid rgba(124,92,252,0.2);border-radius:24px;padding:2.25rem 2rem 2rem;width:100%;max-width:420px;position:relative;animation:modalIn 0.3s ease;box-shadow:0 40px 80px rgba(0,0,0,0.5),0 0 60px rgba(124,92,252,0.1);margin:auto;}
.modal-close{position:absolute;top:1.25rem;right:1.25rem;background:rgba(255,255,255,0.06);border:none;color:var(--muted);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:0.9rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.modal-close:hover{background:rgba(255,255,255,0.12);color:var(--text);}
.modal h2{font-size:1.5rem;font-weight:800;margin-bottom:0.3rem;letter-spacing:-0.02em;}

/* UPGRADE POPUP */
function goUpgrade(planCode){
  closeUpgradePopup();
  var loggedIn = !!(AUTH.token || AUTH.user || localStorage.getItem('cos_token'));

  if(!loggedIn){
    openModal('signupModal');
    return;
  }

  /* If no specific plan, scroll to pricing */
  if(!planCode){
    var pricingEl = document.getElementById('pricing');
    if(pricingEl){
      var navH = document.getElementById('navbar').offsetHeight;
      window.scrollTo({ top: pricingEl.getBoundingClientRect().top + window.pageYOffset - navH - 8, behavior: 'smooth' });
    }
    return;
  }

  /* Initiate Paystack checkout */
  startCheckout(planCode);
}

var PAYSTACK_PAGES = {
  pro_monthly  : 'https://paystack.shop/pay/qjuhqe9nbl',
  pro_yearly   : 'https://paystack.shop/pay/49kpahzr7b',
  team_monthly : 'https://paystack.shop/pay/0vtrblb6i6',
  team_yearly  : 'https://paystack.shop/pay/n3pf1newpn',
};

function startCheckout(planCode){
  if(!AUTH.token && !localStorage.getItem('cos_token')){
    openModal('loginModal');
    return;
  }

  var url = PAYSTACK_PAGES[planCode];
  if(!url){ showToast('Invalid plan selected.'); return; }

  /* Pre-fill email from logged in user */
  var user = AUTH.user;
  if(!user) try{ user = JSON.parse(localStorage.getItem('cos_user')); }catch(e){}
  if(user && user.email){
    url += (url.indexOf('?') >= 0 ? '&' : '?') + 'email=' + encodeURIComponent(user.email);
    if(user.name){
      var parts = user.name.split(' ');
      url += '&first_name=' + encodeURIComponent(parts[0] || '');
      if(parts.length > 1) url += '&last_name=' + encodeURIComponent(parts.slice(1).join(' '));
    }
  }

  showToast('Redirecting to checkout...');
  setTimeout(function(){ window.location.href = url; }, 500);
}

/* Check URL for payment success on page load */
(function checkPaymentReturn(){
  var params    = new URLSearchParams(window.location.search);
  var ref       = params.get('reference') || params.get('trxref');
  var planParam = params.get('plan');

  if(!ref) return;

  /* Clean URL first */
  window.history.replaceState({}, document.title, window.location.pathname);

  /* Restore auth */
  if(!AUTH.token) AUTH.token = localStorage.getItem('cos_token');
  if(!AUTH.user)  try{ AUTH.user = JSON.parse(localStorage.getItem('cos_user')); }catch(e){}

  if(ref && AUTH.token){
    /* Wait 2 seconds for webhook to process, then fetch fresh plan from backend */
    setTimeout(function(){
      apiCall('GET', '/auth/me')
        .then(function(data){
          if(data.plan){
            AUTH.plan = data.plan;
            localStorage.setItem('cos_plan', data.plan);
            if(AUTH.user){ AUTH.user.plan = data.plan; localStorage.setItem('cos_user', JSON.stringify(AUTH.user)); }
            VR.plan = data.plan;
            updateAuthUI();
            vrCheckPlan();
            var planName = data.plan.charAt(0).toUpperCase() + data.plan.slice(1);
            showToast('Payment successful! You are now on the ' + planName + ' plan.');
          }
        })
        .catch(function(){
          showToast('Payment received! Your plan has been activated.');
        });
    }, 2000);
  } else if(ref) {
    showToast('Payment received! Log in to activate your plan.');
    openModal('loginModal');
  }
})();

];

var _nicheActiveIdx = -1;

function filterNicheSuggestions(val){
  var dd = document.getElementById('niche-dropdown');
  if(!dd) return;
  var q = val.trim().toLowerCase();
  if(!q){ dd.style.display='none'; _nicheActiveIdx=-1; return; }

  var matches = NICHES.filter(function(n){
    return n.toLowerCase().startsWith(q);
  }).slice(0, 8);

  if(!matches.length){ dd.style.display='none'; _nicheActiveIdx=-1; return; }

  dd.innerHTML = matches.map(function(n, i){
    var prefix = n.slice(0, val.length);
    var rest   = n.slice(val.length);
    var bold   = '<span style="color:var(--accent);font-weight:600;">' + prefix + '</span>' + rest;
    return '<div class="cdd-option" data-val="' + n + '" onmousedown="selectNicheSuggestion(this.dataset.val)">' + bold + '</div>';
  }).join('');

  dd.style.display = 'block';
  _nicheActiveIdx = -1;
}

function selectNicheSuggestion(val){
  var inp = document.getElementById('nicheInput');
  var dd  = document.getElementById('niche-dropdown');
  if(inp) inp.value = val;
  if(dd)  dd.style.display = 'none';
  _nicheActiveIdx = -1;
}

function handleNicheKey(e){
  var dd    = document.getElementById('niche-dropdown');
  var items = dd ? dd.querySelectorAll('.cdd-option') : [];
  if(!items.length) return;

  if(e.key === 'ArrowDown'){
    e.preventDefault();
    _nicheActiveIdx = Math.min(_nicheActiveIdx+1, items.length-1);
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    _nicheActiveIdx = Math.max(_nicheActiveIdx-1, -1);
  } else if(e.key === 'Enter' && _nicheActiveIdx >= 0){
    e.preventDefault();
    selectNicheSuggestion(items[_nicheActiveIdx].dataset.val);
    return;
  } else if(e.key === 'Escape'){
    dd.style.display='none'; _nicheActiveIdx=-1; return;
  } else { return; }

  items.forEach(function(item, i){
    item.classList.toggle('open', i === _nicheActiveIdx);
  });
}

/* Close dropdown when clicking outside */
document.addEventListener('click', function(e){
  if(!e.target.closest || !e.target.closest('#nicheInput') && !e.target.closest('#niche-dropdown')){
    var dd = document.getElementById('niche-dropdown');
    if(dd) dd.style.display = 'none';
    _nicheActiveIdx = -1;
  }
});

/* ════════════════════════════════════════
   CONTENT CALENDAR
   ════════════════════════════════════════ */
var CAL_WEEK_OFFSET = 0;   /* 0 = current week */
var CAL_PLANS = [];        /* all plans in memory */
var CAL_SELECTED_DATE = null;

var CAL_DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var CAL_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* Get the Monday of a given week offset */
function calGetWeekStart(offset){
  var now  = new Date();
  var day  = now.getDay(); /* 0=Sun */
  var diff = now.getDate() - day + (day===0 ? -6 : 1); /* Monday */
  var mon  = new Date(now.setDate(diff + offset*7));
  mon.setHours(0,0,0,0);
  return mon;
}

function calDateKey(date){
  return date.toISOString().split('T')[0];
}

function calFormatDate(date){
  return CAL_DAYS[date.getDay()] + ' ' + date.getDate() + ' ' + CAL_MONTHS[date.getMonth()];
}

/* Load plans from localStorage */
function calLoadPlans(){
  try {
    CAL_PLANS = JSON.parse(localStorage.getItem('crevers_cal_plans') || '[]');
  } catch(e){ CAL_PLANS = []; }
}

/* Save plans to localStorage */
function calSavePlans(){
  localStorage.setItem('crevers_cal_plans', JSON.stringify(CAL_PLANS));
}

/* Render the full calendar grid */
function calRender(){
  calLoadPlans();
  var weekStart = calGetWeekStart(CAL_WEEK_OFFSET);
  var weekEnd   = new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+6);

  /* Week label */
  var lbl = document.getElementById('cal-week-label');
  if(lbl){
    if(CAL_WEEK_OFFSET===0) lbl.textContent = 'This Week';
    else if(CAL_WEEK_OFFSET===1) lbl.textContent = 'Next Week';
    else if(CAL_WEEK_OFFSET===-1) lbl.textContent = 'Last Week';
    else lbl.textContent = calFormatDate(weekStart) + ' – ' + calFormatDate(weekEnd);
  }

  /* Stats */
  var weekKeys = [];
  for(var i=0;i<7;i++){
    var d = new Date(weekStart); d.setDate(d.getDate()+i);
    weekKeys.push(calDateKey(d));
  }
  var weekPlans = CAL_PLANS.filter(function(p){ return weekKeys.indexOf(p.date)!==-1; });
  var donePlans = weekPlans.filter(function(p){ return p.done; });

  var statP = document.getElementById('cal-stat-planned');
  var statD = document.getElementById('cal-stat-done');
  if(statP) statP.textContent = weekPlans.length;
  if(statD) statD.textContent = donePlans.length;

  /* Streak — count consecutive days with at least 1 done plan */
  var streak = 0;
  var today  = new Date(); today.setHours(0,0,0,0);
  for(var s=0;s<30;s++){
    var checkDay = new Date(today); checkDay.setDate(checkDay.getDate()-s);
    var key = calDateKey(checkDay);
    var hasDone = CAL_PLANS.some(function(p){ return p.date===key && p.done; });
    if(hasDone) streak++;
    else if(s>0) break;
  }
  var statS = document.getElementById('cal-stat-streak');
  if(statS) statS.textContent = streak;

  /* Grid */
  var grid = document.getElementById('cal-grid');
  if(!grid) return;
  grid.innerHTML = '';

  var todayKey = calDateKey(new Date());

  for(var i=0;i<7;i++){
    var date = new Date(weekStart); date.setDate(date.getDate()+i);
    var key  = calDateKey(date);
    var dayPlans = CAL_PLANS.filter(function(p){ return p.date===key; });

    var isToday = key===todayKey;
    var col = document.createElement('div');
    col.className = 'cal-day' + (isToday?' today':'');
    col.innerHTML =
      '<div class="cal-day-name">'+CAL_DAYS[date.getDay()]+'</div>'+
      '<div class="cal-day-num">'+date.getDate()+'</div>';

    /* Plan cards */
    dayPlans.forEach(function(plan){
      var card = document.createElement('div');
      card.className = 'cal-plan-card' + (plan.done?' done':'');
      card.innerHTML =
        '<div class="cal-plan-title">'+escHtml(plan.idea)+'</div>'+
        '<div class="cal-plan-meta">'+
          '<span class="cal-plan-tag">'+escHtml(plan.format)+'</span>'+
          (plan.done?'<span class="cal-plan-tag done-tag">✓ Done</span>':'')+
        '</div>';

      /* Click — open action menu */
      card.onclick = function(e){
        e.stopPropagation();
        calOpenCardMenu(plan, card);
      };
      col.appendChild(card);
    });

    /* Add button */
    var addBtn = document.createElement('button');
    addBtn.className = 'cal-add-btn';
    addBtn.textContent = '+ Add';
    addBtn.onclick = function(d){ return function(){ calOpenAddModal(d); }; }(date);
    col.appendChild(addBtn);

    grid.appendChild(col);
  }
}

/* Open add modal */
function calOpenAddModal(date){
  CAL_SELECTED_DATE = date;
  var lbl = document.getElementById('cal-modal-date');
  if(lbl) lbl.textContent = CAL_DAYS[date.getDay()] + ', ' + CAL_MONTHS[date.getMonth()] + ' ' + date.getDate();
  var inp = document.getElementById('cal-idea-input');
  if(inp) inp.value = '';
  openModal('calModal');
}

/* Save a new plan */
function calSavePlan(){
  var idea     = (document.getElementById('cal-idea-input') || {}).value || '';
  var platform = (document.getElementById('cal-platform-select') || {}).value || 'Instagram';
  var format   = (document.getElementById('cal-format-select') || {}).value || 'Script';

  if(!idea.trim()){ showToast('Please enter a content idea.'); return; }
  if(!AUTH.token){ showToast('Please log in to use the calendar.'); return; }

  var plan = {
    id      : 'plan_' + Date.now(),
    date    : calDateKey(CAL_SELECTED_DATE),
    idea    : idea.trim(),
    platform: platform,
    format  : format,
    done    : false,
    created : new Date().toISOString(),
  };

  CAL_PLANS.push(plan);
  calSavePlans();
  closeModal('calModal');
  calRender();
  showToast('Added to calendar!');
}

/* Card action menu — generate or mark done or delete */
function calOpenCardMenu(plan, cardEl){
  /* Remove any existing menu */
  var existing = document.getElementById('cal-card-menu');
  if(existing){ existing.remove(); return; }

  var menu = document.createElement('div');
  menu.id = 'cal-card-menu';
  menu.style.position   = 'fixed';
  menu.style.zIndex     = '4000';
  menu.style.background = 'var(--surface)';
  menu.style.border     = '1px solid var(--border)';
  menu.style.borderRadius = '12px';
  menu.style.padding    = '6px';
  menu.style.boxShadow  = '0 16px 40px rgba(0,0,0,0.5)';
  menu.style.minWidth   = '160px';

  var actions = [
    { label: plan.done ? '↩ Mark Undone' : '✓ Mark Done', fn: function(){ calToggleDone(plan.id); menu.remove(); } },
    { label: '✏ Generate Now', fn: function(){ calGenerateNow(plan); menu.remove(); } },
    { label: '✕ Delete', fn: function(){ calDeletePlan(plan.id); menu.remove(); }, danger: true },
  ];

  actions.forEach(function(a){
    var btn = document.createElement('button');
    var btnColor = a.danger ? 'var(--accent2)' : 'var(--text)';
    btn.style.display = 'block';
    btn.style.width = '100%';
    btn.style.textAlign = 'left';
    btn.style.background = 'none';
    btn.style.border = 'none';
    btn.style.padding = '8px 12px';
    btn.style.borderRadius = '8px';
    btn.style.fontSize = '0.82rem';
    btn.style.cursor = 'pointer';
    btn.style.color = btnColor;
    btn.style.fontFamily = 'DM Sans, sans-serif';
    btn.style.transition = 'background 0.15s';
    btn.onmouseover = function(){ this.style.background='var(--surface2)'; };
    btn.onmouseout  = function(){ this.style.background='none'; };
    btn.textContent = a.label;
    btn.onclick     = a.fn;
    menu.appendChild(btn);
  });

  /* Position near card */
  var rect = cardEl.getBoundingClientRect();
  menu.style.top  = (rect.bottom + 4) + 'px';
  menu.style.left = rect.left + 'px';
  document.body.appendChild(menu);

  /* Close on outside click */
  setTimeout(function(){
    document.addEventListener('click', function closeCal(e){
      if(!menu.contains(e.target)){ menu.remove(); document.removeEventListener('click', closeCal); }
    });
  }, 100);
}

function calToggleDone(id){
  CAL_PLANS = CAL_PLANS.map(function(p){ return p.id===id ? Object.assign({},p,{done:!p.done}) : p; });
  calSavePlans();
  calRender();
}

function calDeletePlan(id){
  CAL_PLANS = CAL_PLANS.filter(function(p){ return p.id!==id; });
  calSavePlans();
  calRender();
  showToast('Removed from calendar.');
}

function calGenerateNow(plan){
  /* Pre-fill create panel and switch to it */
  switchPanel('create');
  setTimeout(function(){
    var ideaInp = document.getElementById('createIdeaInput');
    if(ideaInp) ideaInp.value = plan.idea;
    /* Set format tab */
    var tabs = document.querySelectorAll('.format-tab');
    tabs.forEach(function(t){
      if(t.dataset.format && plan.format.toLowerCase().includes(t.dataset.format.toLowerCase())){
        t.click();
      }
    });
    showToast('Idea loaded. Click Generate!');
  }, 200);
}

function calChangeWeek(dir){
  CAL_WEEK_OFFSET += dir;
  calRender();
}

/* ── Email notification preference ── */
function initEmailNotifToggle(){
  var toggle = document.getElementById('email-notif-toggle');
  var track  = document.getElementById('email-notif-track');
  var knob   = document.getElementById('email-notif-knob');
  if(!toggle) return;
  /* Load from profile */
  var pref = AUTH.emailNotif !== false; /* default true */
  toggle.checked = pref;
  updateNotifToggleUI(pref, track, knob);
}

function updateNotifToggleUI(checked, track, knob){
  if(!track || !knob) return;
  track.style.background = checked ? 'var(--accent)' : 'var(--border)';
  knob.style.transform   = checked ? 'translateX(20px)' : 'translateX(0)';
}

async function saveEmailNotifPref(checked){
  var track = document.getElementById('email-notif-track');
  var knob  = document.getElementById('email-notif-knob');
  updateNotifToggleUI(checked, track, knob);
  AUTH.emailNotif = checked;
  if(!AUTH.token) return;
  try {
    await apiCall('PATCH', '/auth/email-notif', { email_notifications: checked });
    showToast(checked ? 'Email notifications on.' : 'Email notifications off.');
  } catch(e){
    showToast('Could not save preference.');
  }
}

function crvChatToggle(){
  CRV_CHAT_OPEN = !CRV_CHAT_OPEN;
  var btn = document.getElementById('crv-chat-btn');
  var box = document.getElementById('crv-chat-box');
  if(btn) btn.classList.toggle('open', CRV_CHAT_OPEN);
  if(box) box.classList.toggle('open', CRV_CHAT_OPEN);
  if(CRV_CHAT_OPEN){
    var inp = document.getElementById('crv-chat-input');
    if(inp) setTimeout(function(){ inp.focus(); }, 300);
    /* Update plan tag */
    var planTag = document.getElementById('crv-plan-tag');
    if(planTag && AUTH.user){
      var plan = AUTH.plan || 'free';
      planTag.textContent = plan.charAt(0).toUpperCase() + plan.slice(1);
      planTag.className = plan;
      planTag.style.display = 'inline-block';
    }
  }
}

function crvUpdateSuggestions(panel){
  var suggs = document.getElementById('crv-chat-suggs');
  if(!suggs || CRV_CHAT_HISTORY.length > 0) return;
  var list = CRV_SUGG_MAP[panel] || CRV_SUGG_MAP['dashboard'];
  suggs.innerHTML = list.map(function(s){
    return '<button class="crv-chat-sugg" onclick="crvChatSend(\'' + s.replace(/'/g, "\'") + '\')">' + s + '</button>';
  }).join('');
}

function crvChatClear(){
  CRV_CHAT_HISTORY = [];
  var msgs = document.getElementById('crv-chat-msgs');
  if(msgs){
    msgs.innerHTML = '<div class="crv-msg bot"><div class="crv-msg-avatar">' + CRV_BOT_AVATAR + '</div>' +
      '<div class="crv-msg-bubble">Chat cleared! How can I help you?</div></div>';
  }
  var suggs = document.getElementById('crv-chat-suggs');
  if(suggs){ suggs.style.display = 'flex'; }
}

async function crvChatSend(prefill){
  var input = document.getElementById('crv-chat-input');
  var msg   = prefill || (input ? input.value.trim() : '');
  if(!msg || CRV_CHAT_BUSY) return;

  var suggs = document.getElementById('crv-chat-suggs');
  if(suggs) suggs.style.display = 'none';

  crvAddMsg('user', msg);
  if(input){ input.value = ''; input.style.height = 'auto'; }
  CRV_CHAT_HISTORY.push({ role: 'user', content: msg });

  CRV_CHAT_BUSY = true;
  var btn = document.getElementById('crv-chat-send');
  if(btn) btn.disabled = true;
  var typingEl = crvAddTyping();

  try {
    if(!AUTH.token){
      typingEl.remove();
      var msgs = document.getElementById('crv-chat-msgs');
      if(msgs){
        var div = document.createElement('div');
        div.className = 'crv-msg bot';
        var bubbleDiv = document.createElement('div');
        bubbleDiv.className = 'crv-msg-bubble';
        bubbleDiv.innerHTML = 'You need to sign in to chat with me.';
        var btnRow = document.createElement('div');
        btnRow.style.cssText = 'display:flex;gap:8px;margin-top:10px;';
        var signupBtn = document.createElement('button');
        signupBtn.textContent = 'Sign Up Free';
        signupBtn.style.cssText = 'flex:1;padding:7px 10px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#5a3fd6);border:none;color:#fff;font-size:0.75rem;font-weight:700;cursor:pointer;font-family:Outfit,sans-serif;';
        signupBtn.onclick = function(){ openModal('signupModal'); crvChatToggle(); };
        var loginBtn = document.createElement('button');
        loginBtn.textContent = 'Log In';
        loginBtn.style.cssText = 'flex:1;padding:7px 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:0.75rem;font-weight:600;cursor:pointer;font-family:DM Sans,sans-serif;';
        loginBtn.onclick = function(){ openModal('loginModal'); crvChatToggle(); };
        btnRow.appendChild(signupBtn);
        btnRow.appendChild(loginBtn);
        bubbleDiv.appendChild(btnRow);
        var avatarDiv = document.createElement('div');
        avatarDiv.className = 'crv-msg-avatar';
        avatarDiv.innerHTML = CRV_BOT_AVATAR;
        div.appendChild(avatarDiv);
        div.appendChild(bubbleDiv);
        msgs.appendChild(div);
        msgs.scrollTop = msgs.scrollHeight;
      }
      CRV_CHAT_BUSY = false;
      if(btn) btn.disabled = false;
      return;
    }

    var niche = localStorage.getItem('cos_niche') || 'content creation';
    var resp  = await apiCall('POST', '/ai/chat', { messages: CRV_CHAT_HISTORY, niche: niche });
    typingEl.remove();
    var reply = resp.reply || 'Sorry, could not get a response.';
    crvAddMsg('bot', reply);
    CRV_CHAT_HISTORY.push({ role: 'assistant', content: reply });
    if(CRV_CHAT_HISTORY.length > 20) CRV_CHAT_HISTORY = CRV_CHAT_HISTORY.slice(-20);
    /* Save memory */
    try{ localStorage.setItem('crv_chat_mem', JSON.stringify(CRV_CHAT_HISTORY.slice(-10))); }catch(e){}
  } catch(e) {
    typingEl.remove();
    crvAddMsg('bot', 'Oops! Something went wrong. Please try again.');
  }

  CRV_CHAT_BUSY = false;
  if(btn) btn.disabled = false;
}

function crvAddMsg(role, text){
  var msgs = document.getElementById('crv-chat-msgs');
  if(!msgs) return;
  var initials = role === 'user'
    ? (AUTH && AUTH.user && AUTH.user.name ? AUTH.user.name[0].toUpperCase() : 'U')
    : CRV_BOT_AVATAR;
  var div = document.createElement('div');
  div.className = 'crv-msg ' + role;
  var escaped = escHtml(text).split('\n').join('<br>');
  var bubble = '<div class="crv-msg-bubble">' + escaped;
  if(role === 'bot'){
    bubble += '<button class="crv-msg-copy" onclick="crvCopyMsg(this)" title="Copy">' +
      '<svg viewBox="0 0 24 24" style="width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;">' +
      '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>';
  }
  bubble += '</div>';
  div.innerHTML = '<div class="crv-msg-avatar">' + initials + '</div>' + bubble;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function crvAddTyping(){
  var msgs = document.getElementById('crv-chat-msgs');
  if(!msgs) return { remove: function(){} };
  var div = document.createElement('div');
  div.className = 'crv-msg bot';
  div.innerHTML = '<div class="crv-msg-avatar">' + CRV_BOT_AVATAR + '</div>' +
    '<div class="crv-chat-typing"><span></span><span></span><span></span></div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function crvCopyMsg(btn){
  var bubble = btn.parentElement;
  var text = bubble.innerText.trim();
  navigator.clipboard.writeText(text).then(function(){
    var orig = btn.innerHTML;
    btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:11px;height:11px;stroke:var(--accent3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><polyline points="20 6 9 17 4 12"/></svg>';
    btn.style.opacity = '1';
    setTimeout(function(){ btn.innerHTML = orig; btn.style.opacity = ''; }, 1500);
  });
}

function crvRefineOutput(content, type){
  if(!CRV_CHAT_OPEN) crvChatToggle();
  var suggs = document.getElementById('crv-chat-suggs');
  if(suggs) suggs.style.display = 'none';
  setTimeout(function(){
    crvChatSend('Here is my ' + (type || 'content') + ' that I just generated:\n\n' + content + '\n\nHow can I improve this?');
  }, 400);
}

var TTS_VOICE       = 'alloy';
var TTS_SPEED       = 1.0;
var TTS_HISTORY_KEY = 'crv_tts_history';

function ttsSelectVoice(voice, el){
  TTS_VOICE = voice;
  document.querySelectorAll('.voice-card').forEach(function(c){ c.classList.remove('selected'); });
  if(el) el.classList.add('selected');
}

function ttsSetSpeed(speed, el){
  TTS_SPEED = speed;
  document.querySelectorAll('.tts-speed-btn').forEach(function(b){ b.classList.remove('selected'); });
  if(el) el.classList.add('selected');
  ttsUpdateMeta();
}

function ttsPreset(voice, speed, el){
  TTS_VOICE = voice;
  TTS_SPEED = speed;
  document.querySelectorAll('.tts-preset').forEach(function(b){ b.classList.remove('selected'); });
  if(el) el.classList.add('selected');
  var voices = ['alloy','echo','fable','onyx','nova','shimmer'];
  document.querySelectorAll('.voice-card').forEach(function(c, i){
    c.classList.toggle('selected', voices[i] === voice);
  });
  document.querySelectorAll('.tts-speed-btn').forEach(function(b){
    b.classList.toggle('selected', parseFloat(b.textContent) === speed);
  });
  ttsUpdateMeta();
}

function ttsUpdateMeta(){
  var ta    = document.getElementById('tts-script');
  var chars = ta ? ta.value.length : 0;
  var words = ta && ta.value.trim() ? ta.value.trim().split(/\s+/).filter(Boolean).length : 0;
  var countEl = document.getElementById('tts-char-count');
  var wordEl  = document.getElementById('tts-word-count');
  var durEl   = document.getElementById('tts-est-duration');
  var genBtn  = document.getElementById('tts-gen-btn');
  if(countEl){
    countEl.textContent = chars + ' / 4000 characters';
    countEl.style.color = chars > 3800 ? 'var(--accent2)' : chars > 3500 ? '#f59e0b' : 'var(--muted)';
  }
  if(wordEl) wordEl.textContent = words + ' words';
  if(durEl && words > 0){
    var secs = Math.round((words / (150 * TTS_SPEED)) * 60);
    durEl.textContent = 'Est. ~' + (secs < 60 ? secs + 's' : Math.floor(secs/60) + 'm ' + (secs%60) + 's');
  } else if(durEl){ durEl.textContent = ''; }
  if(genBtn) genBtn.disabled = chars > 4000;
}

function ttsClearScript(){
  var ta = document.getElementById('tts-script');
  if(ta){ ta.value = ''; ttsUpdateMeta(); ta.focus(); }
}

function ttsCopyScript(){
  var ta = document.getElementById('tts-script');
  if(!ta || !ta.value.trim()){ showToast('Nothing to copy.'); return; }
  navigator.clipboard.writeText(ta.value).then(function(){ showToast('Script copied!'); });
}

async function ttsPreviewVoice(voice){
  if(!AUTH.token){ showToast('Sign in to preview voices.'); return; }
  showToast('Loading ' + voice + ' preview...');
  try {
    var resp = await fetch(API_BASE + '/ai/tts', {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+AUTH.token},
      body: JSON.stringify({ text: 'Hey! This is how I sound. I can bring your scripts to life.', voice: voice, speed: 1.0 }),
    });
    if(!resp.ok) throw new Error('Preview failed');
    var blob = await resp.blob();
    var audio = new Audio(URL.createObjectURL(blob));
    audio.play().catch(function(){ showToast('Tap play to hear preview.'); });
  } catch(e){ showToast('Could not load preview.'); }
}

function ttsSendScript(script){
  var ta = document.getElementById('tts-script');
  if(ta){ ta.value = script; ttsUpdateMeta(); }
  switchPanel('voiceover');
  showToast('Script loaded into Voiceover!');
}

function ttsTimeAgo(ts){
  var diff = Date.now() - ts, mins = Math.floor(diff/60000);
  if(mins < 1) return 'Just now';
  if(mins < 60) return mins + 'm ago';
  var hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs/24) + 'd ago';
}

function ttsLoadHistory(){
  try{
    var history = JSON.parse(localStorage.getItem(TTS_HISTORY_KEY) || '[]');
    var wrap = document.getElementById('tts-history-wrap');
    var list = document.getElementById('tts-history-list');
    if(!wrap || !list || !history.length){ if(wrap) wrap.style.display='none'; return; }
    wrap.style.display = 'block';
    list.innerHTML = history.map(function(h, i){
      var src = h.dataUrl || h.url || '';
      return '<div class="tts-history-item">' +
        '<div style="min-width:80px;"><div style="font-size:0.72rem;font-weight:600;color:var(--text);text-transform:capitalize;">' + (h.voice||'alloy') + ' ' + (h.speed||1) + 'x</div>' +
        '<div style="font-size:0.62rem;color:var(--muted);">' + ttsTimeAgo(h.ts) + '</div></div>' +
        '<audio src="' + src + '" controls style="flex:1;height:28px;min-width:0;"></audio>' +
        '<a href="' + src + '" download="' + (h.filename||'voiceover') + '.mp3" class="copy-btn" style="padding:4px 10px;font-size:0.68rem;white-space:nowrap;">Save</a>' +
        '<button class="tts-history-del" onclick="ttsDeleteHistory(' + i + ')">&#10005;</button>' +
        '</div>';
    }).join('');
  }catch(e){}
}

function ttsDeleteHistory(idx){
  try{
    var history = JSON.parse(localStorage.getItem(TTS_HISTORY_KEY) || '[]');
    history.splice(idx, 1);
    localStorage.setItem(TTS_HISTORY_KEY, JSON.stringify(history));
    ttsLoadHistory();
  }catch(e){}
}

function ttsSaveHistory(blob, voice, speed, scriptText){
  try{
    var filename = scriptText.trim().split(/\s+/).slice(0,4).join('-').toLowerCase().replace(/[^a-z0-9-]/g,'') || 'voiceover';
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var history = JSON.parse(localStorage.getItem(TTS_HISTORY_KEY) || '[]');
        history.unshift({ dataUrl: reader.result, voice:voice, speed:speed, ts:Date.now(), filename:filename });
        history = history.slice(0, 3);
        localStorage.setItem(TTS_HISTORY_KEY, JSON.stringify(history));
        ttsLoadHistory();
      }catch(e){ console.warn('TTS history save failed:', e.message); }
    };
    reader.readAsDataURL(blob);
  }catch(e){}
}

async function ttsGenerate(){
  if(!AUTH.token){ openModal('signupModal'); return; }
  var ta = document.getElementById('tts-script');
  var script = (ta ? ta.value : '').trim();
  if(!script){ showToast('Please enter a script first.'); return; }
  if(script.length > 4000){ showToast('Script too long. Max 4000 characters.'); return; }
  var btn=document.getElementById('tts-gen-btn'), player=document.getElementById('tts-player');
  var progress=document.getElementById('tts-progress-bar'), wave=document.getElementById('tts-waveform');
  var audio=document.getElementById('tts-audio'), dlBtn=document.getElementById('tts-download-btn');
  btn.disabled=true;
  btn.innerHTML='<div class="spinner"></div> Generating...';
  if(player) player.style.display='none';
  if(progress) progress.style.display='block';
  try {
    var resp = await fetch(API_BASE+'/ai/tts', {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+AUTH.token},
      body: JSON.stringify({ text:script, voice:TTS_VOICE, speed:TTS_SPEED }),
    });
    if(!resp.ok){ var err=await resp.json().catch(function(){return{};}); throw new Error(err.error||'Failed to generate voiceover.'); }
    var blob=await resp.blob(), url=URL.createObjectURL(blob);
    var filename=script.trim().split(/\s+/).slice(0,4).join('-').toLowerCase().replace(/[^a-z0-9-]/g,'')||'voiceover';
    if(audio){ audio.src=url; audio.play().catch(function(){ showToast('Voiceover ready with '+TTS_VOICE+' voice! Tap play to listen.'); }); }
    if(dlBtn){ dlBtn.href=url; dlBtn.download=filename+'.mp3'; }
    if(progress) progress.style.display='none';
    if(player) player.style.display='block';
    if(wave){ wave.classList.remove('idle'); setTimeout(function(){ if(wave) wave.classList.add('idle'); },5000); }
    ttsSaveHistory(blob, TTS_VOICE, TTS_SPEED, script);
    showToast('Voiceover ready with '+TTS_VOICE+' voice!');
  } catch(e){
    if(progress) progress.style.display='none';
    showToast(e.message||'Could not generate voiceover.');
  }
  btn.disabled=false;
  btn.innerHTML='<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg> Generate Voiceover';
}

  closeCdds();

    cddValues[cddId] = '';
    setTimeout(function(){ input.focus(); }, 100);

}

/* ════════ CONTENT CALENDAR ════════ */
var CAL_WEEK_OFFSET = 0;
var CAL_PLANS_KEY   = 'crv_cal_plans';
var CAL_DAY_NAMES   = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var CAL_MONTHS      = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function calGetPlans(){ try{ return JSON.parse(localStorage.getItem(CAL_PLANS_KEY)||'{}'); }catch(e){ return {}; } }
function calSavePlans(p){ localStorage.setItem(CAL_PLANS_KEY, JSON.stringify(p)); }
function calDateKey(d){ return d.toISOString().split('T')[0]; }

function calGetWeekDates(offset){
  var today = new Date(); var day = today.getDay();
  var diff  = (day===0) ? -6 : 1-day;
  var mon   = new Date(today); mon.setDate(today.getDate()+diff+(offset*7)); mon.setHours(0,0,0,0);
  var days  = [];
  for(var i=0;i<7;i++){ var d=new Date(mon); d.setDate(mon.getDate()+i); days.push(d); }
  return days;
}

function calRender(){
  var days   = calGetWeekDates(CAL_WEEK_OFFSET);
  var plans  = calGetPlans();
  var today  = new Date(); today.setHours(0,0,0,0);

  /* Week label */
  var lbl = document.getElementById('cal-week-label');
  if(lbl){
    if(CAL_WEEK_OFFSET===0) lbl.textContent='This Week';
    else if(CAL_WEEK_OFFSET===-1) lbl.textContent='Last Week';
    else if(CAL_WEEK_OFFSET===1) lbl.textContent='Next Week';
    else lbl.textContent=days[0].getDate()+' '+CAL_MONTHS[days[0].getMonth()]+' – '+days[6].getDate()+' '+CAL_MONTHS[days[6].getMonth()];
  }

  /* Stats */
  var weekPlanned=0,weekDone=0,streak=0;
  days.forEach(function(d){ var k=calDateKey(d),cards=plans[k]||[]; weekPlanned+=cards.length; weekDone+=cards.filter(function(c){return c.done;}).length; });
  var checkD=new Date(today);
  for(var s=0;s<30;s++){ if((plans[calDateKey(checkD)]||[]).some(function(c){return c.done;})){ streak++; } else if(s>0){ break; } checkD.setDate(checkD.getDate()-1); }
  var sp=document.getElementById('cal-stat-planned'); if(sp) sp.textContent=weekPlanned;
  var sd=document.getElementById('cal-stat-done');    if(sd) sd.textContent=weekDone;
  var ss=document.getElementById('cal-stat-streak');  if(ss) ss.textContent=streak;

  /* Day headers */
  var hdr = document.getElementById('cal-days-header');
  if(hdr){
    hdr.innerHTML = days.map(function(d,i){
      return '<div class="cal-day-label">'+CAL_DAY_NAMES[i]+'</div>';
    }).join('');
  }

  /* Grid cells */
  var grid = document.getElementById('cal-grid');
  if(!grid) return;
  grid.innerHTML = '';

  days.forEach(function(d, i){
    var key    = calDateKey(d);
    var cards  = plans[key] || [];
    var isToday= d.getTime()===today.getTime();

    var cell = document.createElement('div');
    cell.className = 'cal-cell' + (isToday?' is-today':'');

    /* Date number */
    var dateDiv = document.createElement('div');
    dateDiv.className = 'cal-cell-date';
    dateDiv.textContent = d.getDate() + ' ' + CAL_MONTHS[d.getMonth()];
    cell.appendChild(dateDiv);

    /* Entries */
    cards.forEach(function(c, ci){
      var entry = document.createElement('div');
      entry.className = 'cal-entry' + (c.done?' done':'');
      entry.title = c.idea + ' • ' + c.platform + ' • ' + c.format;
      entry.innerHTML =
        '<div class="cal-entry-title">'+escHtml(c.idea)+'</div>'+
        '<div class="cal-entry-meta">'+escHtml(c.platform)+'</div>';

      entry.onclick = function(){
        var menu = document.createElement('div');
        menu.style.cssText='position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px;z-index:5000;box-shadow:0 8px 32px rgba(0,0,0,0.4);min-width:140px;';
        var rect = entry.getBoundingClientRect();
        menu.style.top  = (rect.bottom+6)+'px';
        menu.style.left = rect.left+'px';
        var btns = [
          {label: c.done?'Mark Undone':'Mark Done', fn:function(){ calToggleDone(key,ci); }},
          {label:'Generate Now', fn:function(){ calGenerateNow(key,ci); }},
          {label:'Delete', fn:function(){ calDeletePlan(key,ci); }, color:'var(--accent2)'},
        ];
        btns.forEach(function(b){
          var btn=document.createElement('button');
          btn.textContent=b.label;
          btn.style.cssText='display:block;width:100%;text-align:left;background:none;border:none;padding:6px 10px;font-size:0.78rem;cursor:pointer;border-radius:6px;color:'+(b.color||'var(--text)')+';font-family:DM Sans,sans-serif;';
          btn.onmouseenter=function(){this.style.background='var(--surface2)';};
          btn.onmouseleave=function(){this.style.background='none';};
          btn.onclick=function(e){ e.stopPropagation(); document.body.removeChild(menu); b.fn(); };
          menu.appendChild(btn);
        });
        document.body.appendChild(menu);
        setTimeout(function(){ document.addEventListener('click',function rm(){ document.body.contains(menu)&&document.body.removeChild(menu); document.removeEventListener('click',rm); }); },10);
      };
      cell.appendChild(entry);
    });

    /* Add button */
    var addBtn = document.createElement('div');
    addBtn.className = 'cal-cell-add';
    addBtn.innerHTML = '+ Add';
    addBtn.onclick = function(){ calOpenAdd(key, CAL_DAY_NAMES[i]+' '+d.getDate()+' '+CAL_MONTHS[d.getMonth()]); };
    cell.appendChild(addBtn);

    grid.appendChild(cell);
  });
}

function calChangeWeek(dir){ CAL_WEEK_OFFSET+=dir; calRender(); }

var CAL_CURRENT_DATE_KEY='';
function calOpenAdd(dateKey,dateLabel){
  CAL_CURRENT_DATE_KEY=dateKey;
  var lbl=document.getElementById('cal-modal-date'); if(lbl) lbl.textContent=dateLabel;
  var inp=document.getElementById('cal-idea-input'); if(inp) inp.value='';
  openModal('calModal');
}

function calSavePlan(){
  var idea=(document.getElementById('cal-idea-input').value||'').trim();
  var platform=document.getElementById('cal-platform-select').value;
  var format=document.getElementById('cal-format-select').value;
  if(!idea){ showToast('Please enter a content idea.'); return; }
  var plans=calGetPlans();
  if(!plans[CAL_CURRENT_DATE_KEY]) plans[CAL_CURRENT_DATE_KEY]=[];
  plans[CAL_CURRENT_DATE_KEY].push({idea:idea,platform:platform,format:format,done:false,created:Date.now()});
  calSavePlans(plans); closeModal('calModal'); calRender(); showToast('Added!');
}

function calToggleDone(dateKey,idx){
  var plans=calGetPlans();
  if(plans[dateKey]&&plans[dateKey][idx]){ plans[dateKey][idx].done=!plans[dateKey][idx].done; calSavePlans(plans); calRender(); }
}

function calDeletePlan(dateKey,idx){
  var plans=calGetPlans();
  if(plans[dateKey]){ plans[dateKey].splice(idx,1); calSavePlans(plans); calRender(); }
}

function calGenerateNow(dateKey,idx){
  var plans=calGetPlans(); var card=plans[dateKey]&&plans[dateKey][idx];
  if(!card) return;
  switchPanel('create'); setTimeout(function(){ useIdea(card.idea); },300);
}

.tts-waveform span:nth-child(6){animation-delay:0.3s;}
.tts-waveform span:nth-child(7){animation-delay:0.2s;}

var _nicheActiveIdx = -1;

function filterNicheSuggestions(val){
  var dd = document.getElementById('niche-dropdown');
  if(!dd) return;
  var q = val.trim().toLowerCase();
  if(!q){ dd.style.display='none'; _nicheActiveIdx=-1; return; }

  var matches = NICHES.filter(function(n){
    return n.toLowerCase().startsWith(q);
  }).slice(0, 8);

  if(!matches.length){ dd.style.display='none'; _nicheActiveIdx=-1; return; }

  dd.innerHTML = matches.map(function(n, i){
    var prefix = n.slice(0, val.length);
    var rest   = n.slice(val.length);
    var bold   = '<span style="color:var(--accent);font-weight:600;">' + prefix + '</span>' + rest;
    return '<div class="cdd-option" data-val="' + n + '" onmousedown="selectNicheSuggestion(this.dataset.val)">' + bold + '</div>';
  }).join('');

  dd.style.display = 'block';
  _nicheActiveIdx = -1;
}

function selectNicheSuggestion(val){
  var inp = document.getElementById('nicheInput');
  var dd  = document.getElementById('niche-dropdown');
  if(inp) inp.value = val;
  if(dd)  dd.style.display = 'none';
  _nicheActiveIdx = -1;
}

function handleNicheKey(e){
  var dd    = document.getElementById('niche-dropdown');
  var items = dd ? dd.querySelectorAll('.cdd-option') : [];
  if(!items.length) return;

  if(e.key === 'ArrowDown'){
    e.preventDefault();
    _nicheActiveIdx = Math.min(_nicheActiveIdx+1, items.length-1);
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    _nicheActiveIdx = Math.max(_nicheActiveIdx-1, -1);
  } else if(e.key === 'Enter' && _nicheActiveIdx >= 0){
    e.preventDefault();
    selectNicheSuggestion(items[_nicheActiveIdx].dataset.val);
    return;
  } else if(e.key === 'Escape'){
    dd.style.display='none'; _nicheActiveIdx=-1; return;
  } else { return; }

  items.forEach(function(item, i){
    item.classList.toggle('open', i === _nicheActiveIdx);
  });
}

/* Close dropdown when clicking outside */
document.addEventListener('click', function(e){
  if(!e.target.closest || !e.target.closest('#nicheInput') && !e.target.closest('#niche-dropdown')){
    var dd = document.getElementById('niche-dropdown');
    if(dd) dd.style.display = 'none';
    _nicheActiveIdx = -1;
  }
});

/* ════════════════════════════════════════
   CONTENT CALENDAR
   ════════════════════════════════════════ */
var CAL_WEEK_OFFSET = 0;   /* 0 = current week */
var CAL_PLANS = [];        /* all plans in memory */
var CAL_SELECTED_DATE = null;

var CAL_DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var CAL_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* Get the Monday of a given week offset */
function calGetWeekStart(offset){
  var now  = new Date();
  var day  = now.getDay(); /* 0=Sun */
  var diff = now.getDate() - day + (day===0 ? -6 : 1); /* Monday */
  var mon  = new Date(now.setDate(diff + offset*7));
  mon.setHours(0,0,0,0);
  return mon;
}

function calDateKey(date){
  return date.toISOString().split('T')[0];
}

function calFormatDate(date){
  return CAL_DAYS[date.getDay()] + ' ' + date.getDate() + ' ' + CAL_MONTHS[date.getMonth()];
}

/* Load plans from localStorage */
function calLoadPlans(){
  try {
    CAL_PLANS = JSON.parse(localStorage.getItem('crevers_cal_plans') || '[]');
  } catch(e){ CAL_PLANS = []; }
}

/* Save plans to localStorage */
function calSavePlans(){
  localStorage.setItem('crevers_cal_plans', JSON.stringify(CAL_PLANS));
}

/* Render the full calendar grid */
function calRender(){
  calLoadPlans();
  var weekStart = calGetWeekStart(CAL_WEEK_OFFSET);
  var weekEnd   = new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+6);

  /* Week label */
  var lbl = document.getElementById('cal-week-label');
  if(lbl){
    if(CAL_WEEK_OFFSET===0) lbl.textContent = 'This Week';
    else if(CAL_WEEK_OFFSET===1) lbl.textContent = 'Next Week';
    else if(CAL_WEEK_OFFSET===-1) lbl.textContent = 'Last Week';
    else lbl.textContent = calFormatDate(weekStart) + ' – ' + calFormatDate(weekEnd);
  }

  /* Stats */
  var weekKeys = [];
  for(var i=0;i<7;i++){
    var d = new Date(weekStart); d.setDate(d.getDate()+i);
    weekKeys.push(calDateKey(d));
  }
  var weekPlans = CAL_PLANS.filter(function(p){ return weekKeys.indexOf(p.date)!==-1; });
  var donePlans = weekPlans.filter(function(p){ return p.done; });

  var statP = document.getElementById('cal-stat-planned');
  var statD = document.getElementById('cal-stat-done');
  if(statP) statP.textContent = weekPlans.length;
  if(statD) statD.textContent = donePlans.length;

  /* Streak — count consecutive days with at least 1 done plan */
  var streak = 0;
  var today  = new Date(); today.setHours(0,0,0,0);
  for(var s=0;s<30;s++){
    var checkDay = new Date(today); checkDay.setDate(checkDay.getDate()-s);
    var key = calDateKey(checkDay);
    var hasDone = CAL_PLANS.some(function(p){ return p.date===key && p.done; });
    if(hasDone) streak++;
    else if(s>0) break;
  }
  var statS = document.getElementById('cal-stat-streak');
  if(statS) statS.textContent = streak;

  /* Grid */
  var grid = document.getElementById('cal-grid');
  if(!grid) return;
  grid.innerHTML = '';

  var todayKey = calDateKey(new Date());

  for(var i=0;i<7;i++){
    var date = new Date(weekStart); date.setDate(date.getDate()+i);
    var key  = calDateKey(date);
    var dayPlans = CAL_PLANS.filter(function(p){ return p.date===key; });

    var isToday = key===todayKey;
    var col = document.createElement('div');
    col.className = 'cal-day' + (isToday?' today':'');
    col.innerHTML =
      '<div class="cal-day-name">'+CAL_DAYS[date.getDay()]+'</div>'+
      '<div class="cal-day-num">'+date.getDate()+'</div>';

    /* Plan cards */
    dayPlans.forEach(function(plan){
      var card = document.createElement('div');
      card.className = 'cal-plan-card' + (plan.done?' done':'');
      card.innerHTML =
        '<div class="cal-plan-title">'+escHtml(plan.idea)+'</div>'+
        '<div class="cal-plan-meta">'+
          '<span class="cal-plan-tag">'+escHtml(plan.format)+'</span>'+
          (plan.done?'<span class="cal-plan-tag done-tag">✓ Done</span>':'')+
        '</div>';

      /* Click — open action menu */
      card.onclick = function(e){
        e.stopPropagation();
        calOpenCardMenu(plan, card);
      };
      col.appendChild(card);
    });

    /* Add button */
    var addBtn = document.createElement('button');
    addBtn.className = 'cal-add-btn';
    addBtn.textContent = '+ Add';
    addBtn.onclick = function(d){ return function(){ calOpenAddModal(d); }; }(date);
    col.appendChild(addBtn);

    grid.appendChild(col);
  }
}

/* Open add modal */
function calOpenAddModal(date){
  CAL_SELECTED_DATE = date;
  var lbl = document.getElementById('cal-modal-date');
  if(lbl) lbl.textContent = CAL_DAYS[date.getDay()] + ', ' + CAL_MONTHS[date.getMonth()] + ' ' + date.getDate();
  var inp = document.getElementById('cal-idea-input');
  if(inp) inp.value = '';
  openModal('calModal');
}

/* Save a new plan */
function calSavePlan(){
  var idea     = (document.getElementById('cal-idea-input') || {}).value || '';
  var platform = (document.getElementById('cal-platform-select') || {}).value || 'Instagram';
  var format   = (document.getElementById('cal-format-select') || {}).value || 'Script';

  if(!idea.trim()){ showToast('Please enter a content idea.'); return; }
  if(!AUTH.token){ showToast('Please log in to use the calendar.'); return; }

  var plan = {
    id      : 'plan_' + Date.now(),
    date    : calDateKey(CAL_SELECTED_DATE),
    idea    : idea.trim(),
    platform: platform,
    format  : format,
    done    : false,
    created : new Date().toISOString(),
  };

  CAL_PLANS.push(plan);
  calSavePlans();
  closeModal('calModal');
  calRender();
  showToast('Added to calendar!');
}

/* Card action menu — generate or mark done or delete */
function calOpenCardMenu(plan, cardEl){
  /* Remove any existing menu */
  var existing = document.getElementById('cal-card-menu');
  if(existing){ existing.remove(); return; }

  var menu = document.createElement('div');
  menu.id = 'cal-card-menu';
  menu.style.position   = 'fixed';
  menu.style.zIndex     = '4000';
  menu.style.background = 'var(--surface)';
  menu.style.border     = '1px solid var(--border)';
  menu.style.borderRadius = '12px';
  menu.style.padding    = '6px';
  menu.style.boxShadow  = '0 16px 40px rgba(0,0,0,0.5)';
  menu.style.minWidth   = '160px';

  var actions = [
    { label: plan.done ? '↩ Mark Undone' : '✓ Mark Done', fn: function(){ calToggleDone(plan.id); menu.remove(); } },
    { label: '✏ Generate Now', fn: function(){ calGenerateNow(plan); menu.remove(); } },
    { label: '✕ Delete', fn: function(){ calDeletePlan(plan.id); menu.remove(); }, danger: true },
  ];

  actions.forEach(function(a){
    var btn = document.createElement('button');
    var btnColor = a.danger ? 'var(--accent2)' : 'var(--text)';
    btn.style.display = 'block';
    btn.style.width = '100%';
    btn.style.textAlign = 'left';
    btn.style.background = 'none';
    btn.style.border = 'none';
    btn.style.padding = '8px 12px';
    btn.style.borderRadius = '8px';
    btn.style.fontSize = '0.82rem';
    btn.style.cursor = 'pointer';
    btn.style.color = btnColor;
    btn.style.fontFamily = 'DM Sans, sans-serif';
    btn.style.transition = 'background 0.15s';
    btn.onmouseover = function(){ this.style.background='var(--surface2)'; };
    btn.onmouseout  = function(){ this.style.background='none'; };
    btn.textContent = a.label;
    btn.onclick     = a.fn;
    menu.appendChild(btn);
  });

  /* Position near card */
  var rect = cardEl.getBoundingClientRect();
  menu.style.top  = (rect.bottom + 4) + 'px';
  menu.style.left = rect.left + 'px';
  document.body.appendChild(menu);

  /* Close on outside click */
  setTimeout(function(){
    document.addEventListener('click', function closeCal(e){
      if(!menu.contains(e.target)){ menu.remove(); document.removeEventListener('click', closeCal); }
    });
  }, 100);
}

function calToggleDone(id){
  CAL_PLANS = CAL_PLANS.map(function(p){ return p.id===id ? Object.assign({},p,{done:!p.done}) : p; });
  calSavePlans();
  calRender();
}

function calDeletePlan(id){
  CAL_PLANS = CAL_PLANS.filter(function(p){ return p.id!==id; });
  calSavePlans();
  calRender();
  showToast('Removed from calendar.');
}

function calGenerateNow(plan){
  /* Pre-fill create panel and switch to it */
  switchPanel('create');
  setTimeout(function(){
    var ideaInp = document.getElementById('createIdeaInput');
    if(ideaInp) ideaInp.value = plan.idea;
    /* Set format tab */
    var tabs = document.querySelectorAll('.format-tab');
    tabs.forEach(function(t){
      if(t.dataset.format && plan.format.toLowerCase().includes(t.dataset.format.toLowerCase())){
        t.click();
      }
    });
    showToast('Idea loaded. Click Generate!');
  }, 200);
}

function calChangeWeek(dir){
  CAL_WEEK_OFFSET += dir;
  calRender();
}

/* ── Email notification preference ── */
function initEmailNotifToggle(){
  var toggle = document.getElementById('email-notif-toggle');
  var track  = document.getElementById('email-notif-track');
  var knob   = document.getElementById('email-notif-knob');
  if(!toggle) return;
  /* Load from profile */
  var pref = AUTH.emailNotif !== false; /* default true */
  toggle.checked = pref;
  updateNotifToggleUI(pref, track, knob);
}

function updateNotifToggleUI(checked, track, knob){
  if(!track || !knob) return;
  track.style.background = checked ? 'var(--accent)' : 'var(--border)';
  knob.style.transform   = checked ? 'translateX(20px)' : 'translateX(0)';
}

async function saveEmailNotifPref(checked){
  var track = document.getElementById('email-notif-track');
  var knob  = document.getElementById('email-notif-knob');
  updateNotifToggleUI(checked, track, knob);
  AUTH.emailNotif = checked;
  if(!AUTH.token) return;
  try {
    await apiCall('PATCH', '/auth/email-notif', { email_notifications: checked });
    showToast(checked ? 'Email notifications on.' : 'Email notifications off.');
  } catch(e){
    showToast('Could not save preference.');
  }
}
