function crvChatToggle(){
  CRV_CHAT_OPEN = !CRV_CHAT_OPEN;
  var btn = document.getElementById('crv-chat-btn');
  var box = document.getElementById('crv-chat-box');
  if(btn) btn.classList.toggle('open', CRV_CHAT_OPEN);
  if(box) box.classList.toggle('open', CRV_CHAT_OPEN);
  if(CRV_CHAT_OPEN){
    var inp = document.getElementById('crv-chat-input');
    if(inp) setTimeout(function(){ inp.focus(); }, 300);
    /* Update plan tag */
    var planTag = document.getElementById('crv-plan-tag');
    if(planTag && AUTH.user){
      var plan = AUTH.plan || 'free';
      planTag.textContent = plan.charAt(0).toUpperCase() + plan.slice(1);
      planTag.className = plan;
      planTag.style.display = 'inline-block';
    }
  }
}

function crvUpdateSuggestions(panel){
  var suggs = document.getElementById('crv-chat-suggs');
  if(!suggs || CRV_CHAT_HISTORY.length > 0) return;
  var list = CRV_SUGG_MAP[panel] || CRV_SUGG_MAP['dashboard'];
  suggs.innerHTML = list.map(function(s){
    return '<button class="crv-chat-sugg" onclick="crvChatSend(\'' + s.replace(/'/g, "\'") + '\')">' + s + '</button>';
  }).join('');
}

function crvChatClear(){
  CRV_CHAT_HISTORY = [];
  var msgs = document.getElementById('crv-chat-msgs');
  if(msgs){
    msgs.innerHTML = '<div class="crv-msg bot"><div class="crv-msg-avatar">' + CRV_BOT_AVATAR + '</div>' +
      '<div class="crv-msg-bubble">Chat cleared! How can I help you?</div></div>';
  }
  var suggs = document.getElementById('crv-chat-suggs');
  if(suggs){ suggs.style.display = 'flex'; }
}

async function crvChatSend(prefill){
  var input = document.getElementById('crv-chat-input');
  var msg   = prefill || (input ? input.value.trim() : '');
  if(!msg || CRV_CHAT_BUSY) return;

  var suggs = document.getElementById('crv-chat-suggs');
  if(suggs) suggs.style.display = 'none';

  crvAddMsg('user', msg);
  if(input){ input.value = ''; input.style.height = 'auto'; }
  CRV_CHAT_HISTORY.push({ role: 'user', content: msg });

  CRV_CHAT_BUSY = true;
  var btn = document.getElementById('crv-chat-send');
  if(btn) btn.disabled = true;
  var typingEl = crvAddTyping();

  try {
    if(!AUTH.token){
      typingEl.remove();
      var msgs = document.getElementById('crv-chat-msgs');
      if(msgs){
        var div = document.createElement('div');
        div.className = 'crv-msg bot';
        var bubbleDiv = document.createElement('div');
        bubbleDiv.className = 'crv-msg-bubble';
        bubbleDiv.innerHTML = 'You need to sign in to chat with me.';
        var btnRow = document.createElement('div');
        btnRow.style.cssText = 'display:flex;gap:8px;margin-top:10px;';
        var signupBtn = document.createElement('button');
        signupBtn.textContent = 'Sign Up Free';
        signupBtn.style.cssText = 'flex:1;padding:7px 10px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#5a3fd6);border:none;color:#fff;font-size:0.75rem;font-weight:700;cursor:pointer;font-family:Outfit,sans-serif;';
        signupBtn.onclick = function(){ openModal('signupModal'); crvChatToggle(); };
        var loginBtn = document.createElement('button');
        loginBtn.textContent = 'Log In';
        loginBtn.style.cssText = 'flex:1;padding:7px 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:0.75rem;font-weight:600;cursor:pointer;font-family:DM Sans,sans-serif;';
        loginBtn.onclick = function(){ openModal('loginModal'); crvChatToggle(); };
        btnRow.appendChild(signupBtn);
        btnRow.appendChild(loginBtn);
        bubbleDiv.appendChild(btnRow);
        var avatarDiv = document.createElement('div');
        avatarDiv.className = 'crv-msg-avatar';
        avatarDiv.innerHTML = CRV_BOT_AVATAR;
        div.appendChild(avatarDiv);
        div.appendChild(bubbleDiv);
        msgs.appendChild(div);
        msgs.scrollTop = msgs.scrollHeight;
      }
      CRV_CHAT_BUSY = false;
      if(btn) btn.disabled = false;
      return;
    }

    var niche = localStorage.getItem('cos_niche') || 'content creation';
    var resp  = await apiCall('POST', '/ai/chat', { messages: CRV_CHAT_HISTORY, niche: niche });
    typingEl.remove();
    var reply = resp.reply || 'Sorry, could not get a response.';
    crvAddMsg('bot', reply);
    CRV_CHAT_HISTORY.push({ role: 'assistant', content: reply });
    if(CRV_CHAT_HISTORY.length > 20) CRV_CHAT_HISTORY = CRV_CHAT_HISTORY.slice(-20);
    /* Save memory */
    try{ localStorage.setItem('crv_chat_mem', JSON.stringify(CRV_CHAT_HISTORY.slice(-10))); }catch(e){}
  } catch(e) {
    typingEl.remove();
    crvAddMsg('bot', 'Oops! Something went wrong. Please try again.');
  }

  CRV_CHAT_BUSY = false;
  if(btn) btn.disabled = false;
}

function crvAddMsg(role, text){
  var msgs = document.getElementById('crv-chat-msgs');
  if(!msgs) return;
  var initials = role === 'user'
    ? (AUTH && AUTH.user && AUTH.user.name ? AUTH.user.name[0].toUpperCase() : 'U')
    : CRV_BOT_AVATAR;
  var div = document.createElement('div');
  div.className = 'crv-msg ' + role;
  var escaped = escHtml(text).split('\n').join('<br>');
  var bubble = '<div class="crv-msg-bubble">' + escaped;
  if(role === 'bot'){
    bubble += '<button class="crv-msg-copy" onclick="crvCopyMsg(this)" title="Copy">' +
      '<svg viewBox="0 0 24 24" style="width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;">' +
      '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>';
  }
  bubble += '</div>';
  div.innerHTML = '<div class="crv-msg-avatar">' + initials + '</div>' + bubble;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function crvAddTyping(){
  var msgs = document.getElementById('crv-chat-msgs');
  if(!msgs) return { remove: function(){} };
  var div = document.createElement('div');
  div.className = 'crv-msg bot';
  div.innerHTML = '<div class="crv-msg-avatar">' + CRV_BOT_AVATAR + '</div>' +
    '<div class="crv-chat-typing"><span></span><span></span><span></span></div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function crvCopyMsg(btn){
  var bubble = btn.parentElement;
  var text = bubble.innerText.trim();
  navigator.clipboard.writeText(text).then(function(){
    var orig = btn.innerHTML;
    btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:11px;height:11px;stroke:var(--accent3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><polyline points="20 6 9 17 4 12"/></svg>';
    btn.style.opacity = '1';
    setTimeout(function(){ btn.innerHTML = orig; btn.style.opacity = ''; }, 1500);
  });
}

function crvRefineOutput(content, type){
  if(!CRV_CHAT_OPEN) crvChatToggle();
  var suggs = document.getElementById('crv-chat-suggs');
  if(suggs) suggs.style.display = 'none';
  setTimeout(function(){
    crvChatSend('Here is my ' + (type || 'content') + ' that I just generated:\n\n' + content + '\n\nHow can I improve this?');
  }, 400);
}

var TTS_VOICE       = 'alloy';
var TTS_SPEED       = 1.0;
var TTS_HISTORY_KEY = 'crv_tts_history';

function ttsSelectVoice(voice, el){
  TTS_VOICE = voice;
  document.querySelectorAll('.voice-card').forEach(function(c){ c.classList.remove('selected'); });
  if(el) el.classList.add('selected');
}

function ttsSetSpeed(speed, el){
  TTS_SPEED = speed;
  document.querySelectorAll('.tts-speed-btn').forEach(function(b){ b.classList.remove('selected'); });
  if(el) el.classList.add('selected');
  ttsUpdateMeta();
}

function ttsPreset(voice, speed, el){
  TTS_VOICE = voice;
  TTS_SPEED = speed;
  document.querySelectorAll('.tts-preset').forEach(function(b){ b.classList.remove('selected'); });
  if(el) el.classList.add('selected');
  var voices = ['alloy','echo','fable','onyx','nova','shimmer'];
  document.querySelectorAll('.voice-card').forEach(function(c, i){
    c.classList.toggle('selected', voices[i] === voice);
  });
  document.querySelectorAll('.tts-speed-btn').forEach(function(b){
    b.classList.toggle('selected', parseFloat(b.textContent) === speed);
  });
  ttsUpdateMeta();
}

function ttsUpdateMeta(){
  var ta    = document.getElementById('tts-script');
  var chars = ta ? ta.value.length : 0;
  var words = ta && ta.value.trim() ? ta.value.trim().split(/\s+/).filter(Boolean).length : 0;
  var countEl = document.getElementById('tts-char-count');
  var wordEl  = document.getElementById('tts-word-count');
  var durEl   = document.getElementById('tts-est-duration');
  var genBtn  = document.getElementById('tts-gen-btn');
  if(countEl){
    countEl.textContent = chars + ' / 4000 characters';
    countEl.style.color = chars > 3800 ? 'var(--accent2)' : chars > 3500 ? '#f59e0b' : 'var(--muted)';
  }
  if(wordEl) wordEl.textContent = words + ' words';
  if(durEl && words > 0){
    var secs = Math.round((words / (150 * TTS_SPEED)) * 60);
    durEl.textContent = 'Est. ~' + (secs < 60 ? secs + 's' : Math.floor(secs/60) + 'm ' + (secs%60) + 's');
  } else if(durEl){ durEl.textContent = ''; }
  if(genBtn) genBtn.disabled = chars > 4000;
}

function ttsClearScript(){
  var ta = document.getElementById('tts-script');
  if(ta){ ta.value = ''; ttsUpdateMeta(); ta.focus(); }
}

function ttsCopyScript(){
  var ta = document.getElementById('tts-script');
  if(!ta || !ta.value.trim()){ showToast('Nothing to copy.'); return; }
  navigator.clipboard.writeText(ta.value).then(function(){ showToast('Script copied!'); });
}

async function ttsPreviewVoice(voice){
  if(!AUTH.token){ showToast('Sign in to preview voices.'); return; }
  showToast('Loading ' + voice + ' preview...');
  try {
    var resp = await fetch(API_BASE + '/ai/tts', {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+AUTH.token},
      body: JSON.stringify({ text: 'Hey! This is how I sound. I can bring your scripts to life.', voice: voice, speed: 1.0 }),
    });
    if(!resp.ok) throw new Error('Preview failed');
    var blob = await resp.blob();
    var audio = new Audio(URL.createObjectURL(blob));
    audio.play().catch(function(){ showToast('Tap play to hear preview.'); });
  } catch(e){ showToast('Could not load preview.'); }
}

function ttsSendScript(script){
  var ta = document.getElementById('tts-script');
  if(ta){ ta.value = script; ttsUpdateMeta(); }
  switchPanel('voiceover');
  showToast('Script loaded into Voiceover!');
}

function ttsTimeAgo(ts){
  var diff = Date.now() - ts, mins = Math.floor(diff/60000);
  if(mins < 1) return 'Just now';
  if(mins < 60) return mins + 'm ago';
  var hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs/24) + 'd ago';
}

function ttsLoadHistory(){
  try{
    var history = JSON.parse(localStorage.getItem(TTS_HISTORY_KEY) || '[]');
    var wrap = document.getElementById('tts-history-wrap');
    var list = document.getElementById('tts-history-list');
    if(!wrap || !list || !history.length){ if(wrap) wrap.style.display='none'; return; }
    wrap.style.display = 'block';
    list.innerHTML = history.map(function(h, i){
      var src = h.dataUrl || h.url || '';
      return '<div class="tts-history-item">' +
        '<div style="min-width:80px;"><div style="font-size:0.72rem;font-weight:600;color:var(--text);text-transform:capitalize;">' + (h.voice||'alloy') + ' ' + (h.speed||1) + 'x</div>' +
        '<div style="font-size:0.62rem;color:var(--muted);">' + ttsTimeAgo(h.ts) + '</div></div>' +
        '<audio src="' + src + '" controls style="flex:1;height:28px;min-width:0;"></audio>' +
        '<a href="' + src + '" download="' + (h.filename||'voiceover') + '.mp3" class="copy-btn" style="padding:4px 10px;font-size:0.68rem;white-space:nowrap;">Save</a>' +
        '<button class="tts-history-del" onclick="ttsDeleteHistory(' + i + ')">&#10005;</button>' +
        '</div>';
    }).join('');
  }catch(e){}
}

function ttsDeleteHistory(idx){
  try{
    var history = JSON.parse(localStorage.getItem(TTS_HISTORY_KEY) || '[]');
    history.splice(idx, 1);
    localStorage.setItem(TTS_HISTORY_KEY, JSON.stringify(history));
    ttsLoadHistory();
  }catch(e){}
}

function ttsSaveHistory(blob, voice, speed, scriptText){
  try{
    var filename = scriptText.trim().split(/\s+/).slice(0,4).join('-').toLowerCase().replace(/[^a-z0-9-]/g,'') || 'voiceover';
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var history = JSON.parse(localStorage.getItem(TTS_HISTORY_KEY) || '[]');
        history.unshift({ dataUrl: reader.result, voice:voice, speed:speed, ts:Date.now(), filename:filename });
        history = history.slice(0, 3);
        localStorage.setItem(TTS_HISTORY_KEY, JSON.stringify(history));
        ttsLoadHistory();
      }catch(e){ console.warn('TTS history save failed:', e.message); }
    };
    reader.readAsDataURL(blob);
  }catch(e){}
}

async function ttsGenerate(){
  if(!AUTH.token){ openModal('signupModal'); return; }
  var ta = document.getElementById('tts-script');
  var script = (ta ? ta.value : '').trim();
  if(!script){ showToast('Please enter a script first.'); return; }
  if(script.length > 4000){ showToast('Script too long. Max 4000 characters.'); return; }
  var btn=document.getElementById('tts-gen-btn'), player=document.getElementById('tts-player');
  var progress=document.getElementById('tts-progress-bar'), wave=document.getElementById('tts-waveform');
  var audio=document.getElementById('tts-audio'), dlBtn=document.getElementById('tts-download-btn');
  btn.disabled=true;
  btn.innerHTML='<div class="spinner"></div> Generating...';
  if(player) player.style.display='none';
  if(progress) progress.style.display='block';
  try {
    var resp = await fetch(API_BASE+'/ai/tts', {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+AUTH.token},
      body: JSON.stringify({ text:script, voice:TTS_VOICE, speed:TTS_SPEED }),
    });
    if(!resp.ok){ var err=await resp.json().catch(function(){return{};}); throw new Error(err.error||'Failed to generate voiceover.'); }
    var blob=await resp.blob(), url=URL.createObjectURL(blob);
    var filename=script.trim().split(/\s+/).slice(0,4).join('-').toLowerCase().replace(/[^a-z0-9-]/g,'')||'voiceover';
    if(audio){ audio.src=url; audio.play().catch(function(){ showToast('Voiceover ready with '+TTS_VOICE+' voice! Tap play to listen.'); }); }
    if(dlBtn){ dlBtn.href=url; dlBtn.download=filename+'.mp3'; }
    if(progress) progress.style.display='none';
    if(player) player.style.display='block';
    if(wave){ wave.classList.remove('idle'); setTimeout(function(){ if(wave) wave.classList.add('idle'); },5000); }
    ttsSaveHistory(blob, TTS_VOICE, TTS_SPEED, script);
    showToast('Voiceover ready with '+TTS_VOICE+' voice!');
  } catch(e){
    if(progress) progress.style.display='none';
    showToast(e.message||'Could not generate voiceover.');
  }
  btn.disabled=false;
  btn.innerHTML='<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg> Generate Voiceover';
}

}
